syntax = "proto3";

option csharp_namespace = "InventoryService.Grpc";

package inventory;

service InventoryLookup {
  rpc GetByProductId (GetInventoryItemRequest) returns (InventoryItemReply);
}

message GetInventoryItemRequest {
  int32 product_id = 1;
}

message InventoryItemReply {
  int32 product_id = 1;
  string name = 2;
  int32 quantity = 3;
  bool found = 4;
}
