name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run shared verification script
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Prepare Compose test environment
        run: |
          {
            printf 'IMAGE_PREFIX=mini-orders\n'
            printf 'IMAGE_TAG=local\n'
            printf 'SQL_PASSWORD=CiOnlySqlPassword123!\n'
            printf 'RABBITMQ_USERNAME=ciuser\n'
            printf 'RABBITMQ_PASSWORD=CiOnlyRabbitPassword123!\n'
            printf 'JWT_ISSUER=MiniOrderManagement\n'
            printf 'JWT_AUDIENCE=MiniOrderManagement\n'
            printf 'JWT_KEY=ci-only-signing-key-that-is-long-enough-12345\n'
          } > .env

      - name: Start Compose stack
        run: docker compose up -d --no-build

      - name: Run Compose smoke tests
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:5000/orders/health && \
               curl --fail --silent --show-error http://localhost:5000/inventory/health; then
              echo "Compose smoke tests passed on attempt $attempt."
              exit 0
            fi

            echo "Services are not ready yet (attempt $attempt/60)."
            sleep 5
          done

          echo "Compose smoke tests failed. Service status:"
          docker compose ps
          echo "Compose logs:"
          docker compose logs --no-color
          exit 1

      - name: Run order flow smoke test
        run: |
          product_id=9999

          curl --fail --silent --show-error \
            -X POST http://localhost:5000/inventory/stock \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":$product_id,\"name\":\"CI Smoke Product\",\"quantity\":10}" \
            > /tmp/stock-response.json

          initial_quantity=$(curl --fail --silent --show-error \
            "http://localhost:5000/inventory/$product_id" | jq -r '.quantity')

          if [[ "$initial_quantity" != "10" ]]; then
            echo "Expected initial quantity 10, got $initial_quantity."
            exit 1
          fi

          token=$(curl --fail --silent --show-error \
            -X POST http://localhost:5000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | jq -r '.accessToken')

          curl --fail --silent --show-error \
            -X POST http://localhost:5000/orders \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            -d "{\"productId\":$product_id,\"quantity\":1}" \
            > /tmp/order-response.json

          for attempt in {1..30}; do
            current_quantity=$(curl --fail --silent --show-error \
              "http://localhost:5000/inventory/$product_id" | jq -r '.quantity')

            if [[ "$current_quantity" == "9" ]]; then
              echo "Order flow smoke test passed on attempt $attempt."
              exit 0
            fi

            echo "Waiting for asynchronous stock reservation (attempt $attempt/30)."
            sleep 2
          done

          echo "Expected quantity 9 after order, got $current_quantity."
          cat /tmp/order-response.json
          exit 1

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
