name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to deploy, for example main or sha-abc1234'
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    env:
      PRODUCTION_PATH: /opt/mini-order-management
      IMAGE_PREFIX: ghcr.io/nikhil401/mini-order-management

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Trust production host
        env:
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Prepare production environment file
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          {
            printf 'IMAGE_PREFIX=%s\n' "$IMAGE_PREFIX"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'SQL_PASSWORD=%s\n' "$SQL_PASSWORD"
            printf 'RABBITMQ_USERNAME=%s\n' "$RABBITMQ_USERNAME"
            printf 'RABBITMQ_PASSWORD=%s\n' "$RABBITMQ_PASSWORD"
            printf 'JWT_ISSUER=%s\n' "$JWT_ISSUER"
            printf 'JWT_AUDIENCE=%s\n' "$JWT_AUDIENCE"
            printf 'JWT_KEY=%s\n' "$JWT_KEY"
          } > .env.production

      - name: Copy deployment files
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "mkdir -p '$PRODUCTION_PATH'"
          scp docker-compose.yml .env.production "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_PATH/"

      - name: Log in and deploy Compose stack
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "cd '$PRODUCTION_PATH' && docker compose --env-file .env.production pull && docker compose --env-file .env.production up -d --remove-orphans"

      - name: Verify production health
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "curl --fail --silent --show-error http://localhost:5000/orders/health"
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "curl --fail --silent --show-error http://localhost:5000/inventory/health"
