services:
  api-gateway:
    image: mini-orders/api-gateway:step7
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ReverseProxy__Clusters__order-cluster__Destinations__order-destination__Address: http://order-service:8080/
      ReverseProxy__Clusters__inventory-cluster__Destinations__inventory-destination__Address: http://inventory-service:8080/
    ports:
      - "5000:8080"
    depends_on:
      - order-service
      - inventory-service

  ui:
    image: mini-orders/ui:step8
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  inventory-service:
    image: mini-orders/inventory-service:step7
    build:
      context: . 
      dockerfile: src/InventoryService/Dockerfile
    environment:
      ConnectionStrings__Inventory: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${SQL_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      Redis__ConnectionString: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
    ports:
      - "5001:8080"
      - "5003:8081"
    depends_on:
      - redis
      - rabbitmq
      - sqlserver

  order-service:
    image: mini-orders/order-service:step7
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    environment:
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=OrdersDb;User Id=sa;Password=${SQL_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Key: "${JWT_KEY}"
      InventoryService__BaseUrl: http://inventory-service:8080
      InventoryService__GrpcBaseUrl: http://inventory-service:8081
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
    ports:
      - "5002:8080"
    depends_on:
      - inventory-service
      - rabbitmq
      - sqlserver

volumes:
  sqlserver-data:
